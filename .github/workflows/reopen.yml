# Lets whoever opened an issue reopen it by commenting /reopen, after it was closed.
# GitHub only lets people with access to the repo reopen an issue a maintainer closed.
name: Reopen on request

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reopen:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'closed' &&
      github.event.comment.user.login == github.event.issue.user.login &&
      startsWith(github.event.comment.body, '/reopen')
    runs-on: ubuntu-latest
    steps:
      - name: Reopen the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue reopen "$NUMBER" --repo "$REPO" --comment "Reopened at the author's request."
