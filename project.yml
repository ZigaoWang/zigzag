name: Zigzag
options:
  bundleIdPrefix: app.zigzag
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    SPARKLE_PUBLIC_KEY: ""
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 432GL3WKY2
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      SPARKLE_PUBLIC_KEY: fcLCAtuyhCGTC62F2cDfj/vAMXgFvrpQSyF3540+hq0=
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  Zigzag:
    type: application
    platform: macOS
    sources:
      - path: Zigzag
    dependencies:
      - package: Sparkle
    info:
      path: Zigzag/Info.plist
      properties:
        CFBundleDisplayName: Zigzag
        CFBundleName: Zigzag
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: https://github.com/ZigaoWang/zigzag/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSCameraUsageDescription: Websites you visit can ask to use your camera.
        NSMicrophoneUsageDescription: Websites you visit can ask to use your microphone.
        NSLocationUsageDescription: Websites you visit can ask for your location.
        NSLocationWhenInUseUsageDescription: Websites you visit can ask for your location.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
            CFBundleTypeRole: Viewer
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html, public.xhtml]
          - CFBundleTypeName: Web archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.apple.webarchive]
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    entitlements:
      path: Zigzag/Zigzag.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
        com.apple.security.cs.allow-unsigned-executable-memory: false
