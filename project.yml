name: Zigzag
options:
  bundleIdPrefix: wang.zigao
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    MARKETING_VERSION: "0.1.8"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SPARKLE_PUBLIC_KEY: ""
    CURRENT_PROJECT_VERSION: "9"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 432GL3WKY2
  configs:
    Debug:
      # The dev build is its own app, "Zigzag Dev", with its own settings, data and website logins, so it never
      # touches the Zigzag you use day to day.
      PRODUCT_BUNDLE_IDENTIFIER: wang.zigao.zigzag.dev
      APP_DISPLAY_NAME: Zigzag Dev
      # A real identity, so the signature stays the same across builds and apps that check who they're
      # talking to (1Password's browser integration) keep trusting it.
      CODE_SIGN_IDENTITY: "Apple Development"
      # Xcode registers the App ID and makes the development profile the Keychain access group needs.
      CODE_SIGN_STYLE: Automatic
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      PRODUCT_BUNDLE_IDENTIFIER: wang.zigao.zigzag
      APP_DISPLAY_NAME: Zigzag
      # Archived with development signing; scripts/release.sh exports it signed with Developer ID, and Xcode makes
      # the Developer ID profile the Keychain access group needs.
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGN_STYLE: Automatic
      SPARKLE_PUBLIC_KEY: fcLCAtuyhCGTC62F2cDfj/vAMXgFvrpQSyF3540+hq0=
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  Zigzag:
    type: application
    platform: macOS
    sources:
      - path: Zigzag
    dependencies:
      - package: Sparkle
    info:
      path: Zigzag/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleIconName: AppIcon
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: https://zigzagbrowser.com/updates/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSCameraUsageDescription: Websites you visit can ask to use your camera.
        NSContactsUsageDescription: Zigzag fills your name, email, phone and address into forms from your own card in Contacts.
        NSMicrophoneUsageDescription: Websites you visit can ask to use your microphone.
        NSLocationUsageDescription: Websites you visit can ask for your location.
        NSLocationWhenInUseUsageDescription: Websites you visit can ask for your location.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
            CFBundleTypeRole: Viewer
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html, public.xhtml]
          - CFBundleTypeName: Web archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.apple.webarchive]
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    entitlements:
      path: Zigzag/Zigzag.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        # Saved passwords live in this group of the data protection keychain, which also syncs through iCloud Keychain.
        # It keeps its first name: renaming it would hide every password already saved.
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.zigzag.passwords
        com.apple.security.personal-information.location: true
        # Your own card in Contacts, to fill your name, email, phone and address into forms.
        com.apple.security.personal-information.addressbook: true
        com.apple.security.cs.allow-unsigned-executable-memory: false
  ZigzagTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZigzagTests
    dependencies:
      - target: Zigzag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.zigao.zigzag.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Zigzag.app/Contents/MacOS/Zigzag
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Zigzag:
    build:
      targets:
        Zigzag: all
        ZigzagTests: [test]
    test:
      targets: [ZigzagTests]
